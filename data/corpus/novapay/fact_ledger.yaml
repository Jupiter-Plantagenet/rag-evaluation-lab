# NovaPay fact ledger -- the authoritative source for every fact in this corpus.
#
# WRITTEN BEFORE ANY PROSE, DELIBERATELY.
#
# If the prose were written first and the ledger derived from it afterwards, a
# number invented while drafting would become "ground truth" by virtue of having
# been written down, and no downstream test could ever catch it: the corpus, the
# expected answers, and the metrics would all agree on the same wrong value.
# Writing the ledger first makes the prose checkable against something.
#
# Invariants enforced by tests/unit/test_fact_ledger.py and
# scripts/validate_corpus.py:
#   1. Every `value` here appears verbatim in its `authoritative_doc`.
#   2. Every document listed in `restated_in` contains the value too, and is
#      marked as restating rather than authoritative.
#   3. Exactly one document is authoritative for each fact.
#   4. Superseded facts carry both values, both dates, and disjoint validity.
#   5. Every `gap` topic appears in NO document (this is what makes the
#      unanswerable cases principled rather than accidental).
#
# EVERYTHING BELOW IS FICTION. See LICENSE in this directory.

meta:
  corpus_id: novapay
  version: 1.0.0
  authored: "2026-08-06"
  currency: USD
  # The in-world "today". Temporal cases are written relative to this, so the
  # corpus does not silently change meaning as real time passes.
  as_of: "2026-06-01"

# ---------------------------------------------------------------------------
# PRICING
# ---------------------------------------------------------------------------
facts:

  - id: fee.card.standard
    value: "2.9% + $0.30"
    unit: per successful card transaction
    authoritative_doc: pricing-and-fees
    restated_in: [product-overview, subscription-plans]
    notes: Seeded from the predecessor corpus.

  - id: fee.card.pro
    value: "2.5% + $0.30"
    unit: per successful card transaction on the Pro plan
    authoritative_doc: pricing-and-fees
    restated_in: [subscription-plans]

  - id: fee.bank_transfer
    value: "1.0%, capped at $5.00"
    unit: per bank transfer
    authoritative_doc: pricing-and-fees

  - id: fee.crypto
    value: "1.5% flat"
    unit: per crypto settlement
    authoritative_doc: pricing-and-fees

  - id: fee.currency_conversion
    value: "1.0%"
    unit: on the converted amount
    authoritative_doc: pricing-and-fees
    # DISTRACTOR PAIR: sits next to fee.card.standard and is the wrong answer to
    # "what does NovaPay charge on an international card payment?"
    distractor_for: [fee.card.standard]

  - id: fee.dispute
    value: "$15.00"
    unit: per dispute, non-refundable even if the dispute is won
    authoritative_doc: refunds-and-disputes
    # DISTRACTOR PAIR: the phrase "dispute fee" lexically resembles
    # "transaction fee" and lives in a different document.
    distractor_for: [fee.card.standard]

  - id: fee.refund
    value: "$0.00"
    unit: NovaPay charges nothing to issue a refund
    authoritative_doc: refunds-and-disputes
    notes: >-
      The original transaction's 2.9% + $0.30 is NOT returned. This distinction
      is the target of a multi-hop case: the refund is free, the original fee is
      not refunded, and the two facts live in different sections.

  - id: fee.express_payout
    value: "0.5%"
    unit: additional, on the payout amount
    authoritative_doc: payout-schedules
    restated_in: [subscription-plans]

  - id: fee.chargeback_representment
    value: "$25.00"
    unit: per representment submitted
    authoritative_doc: refunds-and-disputes

