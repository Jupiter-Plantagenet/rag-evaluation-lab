# ---------------------------------------------------------------------------
# SUPERSEDED POLICIES
#
# Both versions are present in the corpus, both explicitly dated, with disjoint
# validity windows. This is what makes `policy_version_confusion` a measurable
# failure class rather than a hypothetical one.
# ---------------------------------------------------------------------------
superseded:

  - id: policy.refund_window
    current:
      value: "within 120 days of the original transaction"
      effective_from: "2026-03-01"
      doc: refunds-and-disputes
    previous:
      value: "within 90 days of the original transaction"
      effective_from: "2024-01-15"
      effective_until: "2026-02-28"
      doc: policy-archive-2024
    notes: >-
      A question asked without a date should get the CURRENT value. A question
      asked about a transaction from 2025 should get 90 days. Answering "90 days"
      to an undated question is policy_version_confusion, not a retrieval miss --
      the evidence was found, the wrong version was used.

  - id: policy.payout_hold_new_merchants
    current:
      value: "T+7 business days"
      effective_from: "2026-01-10"
      doc: payout-schedules
    previous:
      value: "T+14 business days"
      effective_from: "2023-06-01"
      effective_until: "2026-01-09"
      doc: policy-archive-2024

# ---------------------------------------------------------------------------
# MULTI-HOP CHAINS
# Facts deliberately split so a correct answer must combine documents.
# ---------------------------------------------------------------------------
multihop_chains:

  - id: chain.refund_true_cost
    question_shape: "If I refund a $100 card payment, how much am I out of pocket?"
    hops:
      - {fact: fee.refund, doc: refunds-and-disputes}
      - {fact: fee.card.standard, doc: pricing-and-fees}
    expected_reasoning: >-
      Refund itself is free, but the original $3.20 (2.9% + $0.30) is not
      returned, so the merchant is out $103.20 total.

  - id: chain.first_money_timing
    question_shape: "I just signed up. When do I actually receive my first payout?"
    hops:
      - {fact: limit.kyc_approval_window, doc: account-limits}
      - {fact: payout.first_payout_delay, doc: payout-schedules}

  - id: chain.eea_high_value
    question_shape: "Can a German merchant take a single $8,000 payment?"
    hops:
      - {fact: limit.single_transaction.eea, doc: regional-restrictions}
      - {fact: limit.single_transaction.default, doc: account-limits}
    expected_reasoning: >-
      No -- the EEA limit of $5,000 applies and overrides the $10,000 default.
      Answering "yes, the limit is $10,000" is the designed failure.

  - id: chain.webhook_giveup
    question_shape: "My endpoint was down all day. Did I lose the events?"
    hops:
      - {fact: webhook.retry_schedule, doc: webhook-delivery}
      - {fact: webhook.disable_threshold, doc: webhook-delivery}
      - {fact: retention.webhook_delivery_logs, doc: data-retention}

  - id: chain.disputed_transaction_cost
    question_shape: "A $200 payment was disputed and I lost. What did that cost me?"
    hops:
      - {fact: fee.dispute, doc: refunds-and-disputes}
      - {fact: fee.card.standard, doc: pricing-and-fees}

  - id: chain.pro_upgrade_breakeven
    question_shape: "At what monthly volume does upgrading to Pro pay for itself?"
    hops:
      - {fact: fee.card.standard, doc: pricing-and-fees}
      - {fact: fee.card.pro, doc: pricing-and-fees}
      - {fact: plan.pro_price, doc: subscription-plans}

# ---------------------------------------------------------------------------
# DELIBERATE GAPS
#
# Topics a reasonable person WOULD expect a payment processor to document, and
# which this corpus deliberately does not cover. Unanswerable cases draw only
# from this list, so "unanswerable" is a property of the corpus by design rather
# than an accident of authoring.
#
# TESTED: scripts/validate_corpus.py asserts none of these terms appears in any
# document. If prose drift ever covers one, the corresponding eval case becomes
# invalid and the build fails.
# ---------------------------------------------------------------------------
gaps:
  - id: gap.tax_reporting
    topic: "1099-K / tax form issuance and thresholds"
    probe_terms: ["1099", "tax form", "tax reporting"]

  - id: gap.sla_uptime_number
    topic: "a contractual uptime percentage (e.g. 99.99%)"
    probe_terms: ["uptime guarantee", "99.9", "99.99", "uptime SLA"]
    notes: >-
      incident-response deliberately describes severity and notification WITHOUT
      ever committing to an uptime figure. This is the strongest unanswerable
      case: adjacent, plausible, and genuinely absent.

  - id: gap.mobile_sdk
    topic: "native iOS/Android SDKs"
    probe_terms: ["iOS", "Android", "Swift", "Kotlin", "mobile SDK"]
    notes: >-
      product-overview lists six SERVER-side SDKs, so a retrieval hit on
      "SDK" is near-certain. The correct behaviour is to retrieve that list and
      still abstain on mobile -- which separates "found nothing" from
      "found something adjacent and correctly declined to extrapolate".

  - id: gap.acquiring_bank
    topic: "which banks or card networks NovaPay partners with"
    probe_terms: ["acquiring bank", "partner bank", "sponsor bank"]

  - id: gap.chargeback_protection
    topic: "a chargeback protection or fraud guarantee product"
    probe_terms: ["chargeback protection", "chargeback insurance", "fraud guarantee"]
    notes: >-
      fraud-controls.md is highly retrievable for this and explicitly says Radar
      "does not guarantee any fraud rate" -- so the corpus contains a statement
      that is adjacent, relevant, and the opposite of what the question hopes
      for. Correct behaviour is to say no such product is documented, not to
      infer one from the existence of Radar.

  - id: gap.sandbox_data_reset
    topic: "how to reset or clear test-mode data"
    probe_terms: ["reset test data", "clear test data", "sandbox reset", "wipe test"]
    notes: >-
      api-authentication.md describes test mode at length without ever saying how
      to reset it. A plausible, mundane operational question that the
      documentation simply does not answer -- the most realistic kind of gap.
