chunker:
  kind: fixed_size
  params:
    chunk_overlap: 50
    chunk_size: 500
description: Fixed-size chunking, dense-only retrieval, fixed top-k, single-pass generation.
embedder:
  kind: minilm
  params: {}
evaluation:
  bootstrap_resamples: 10000
  hit_coverage_threshold: 0.5
  judge_enabled: true
  judge_model: gemini-2.5-flash
  judge_temperature: 0.0
  recall_at_k:
  - 1
  - 3
  - 5
  - 10
generator:
  kind: gemini
  params:
    max_output_tokens: 1024
    model: gemini-2.5-flash
    temperature: 0.0
  prompt_template: answer_with_citations.jinja
name: baseline
retrieval:
  dedupe_threshold: 0.8
  deduplicate: false
  fetch_k: 30
  k_rrf: 60
  kind: dense
  top_k: 4
seed: 20260806
