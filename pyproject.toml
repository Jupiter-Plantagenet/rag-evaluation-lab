[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval"
version = "0.1.0"
description = "An evaluation and regression-testing harness for document-grounded RAG: grounding, citations, and measured interventions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "George Akor" }]
keywords = ["rag", "evaluation", "retrieval", "citations", "groundedness", "regression-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# ---------------------------------------------------------------------------
# TIER 1 -- CI-safe core. Everything here resolves and installs on Linux CI
# with no compiler, no CUDA, and no model download. This is the only tier that
# appears in requirements/lock/*.txt.
#
# torch / transformers / faiss-cpu are DELIBERATELY ABSENT. See [.local] below
# and constraints/torch-cpu.txt for why.
# ---------------------------------------------------------------------------
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "Jinja2>=3.1",
  "rich>=13.7",
  "typer>=0.9,<0.13",
  "click>=8.1,<8.2",
  "tenacity>=8.2",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
# TIER 2 -- local/dev only. NEVER resolved by the lock files.
#
# On PyPI's manylinux wheels, `torch` is the CUDA build: putting it in Tier 1
# would make `uv pip compile --python-platform linux` pull ~2.5 GB of nvidia-*
# wheels into CI. It is also already present in the Anaconda base environment
# this project's venv inherits via --system-site-packages, so installing it
# here would be a 453 MB no-op at best and a downgrade at worst (`2.9.1+cpu`
# and `2.9.1` are different versions to pip).
#
# Install with:
#   pip install -r constraints/torch-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
local = [
  "torch==2.9.1+cpu",
  "transformers==4.57.6",
  "huggingface-hub>=0.36",
  "faiss-cpu==1.13.2",
]

# Used only to prove our hand-written MiniLM mean-pooling matches the reference
# implementation (tests/regression/test_minilm_parity.py). Never imported by
# src/ and never installed in CI.
parity = ["sentence-transformers>=5.0"]

gemini = ["google-genai>=1.60"]
braintrust = ["braintrust==0.32.0"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "coverage>=7.5",
  "hypothesis>=6.100",
  "ruff>=0.12",
  "mypy>=1.11",
]

[project.scripts]
rag-eval = "rag_eval.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_eval = ["py.typed", "generation/prompts/*.jinja", "reporting/templates/*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
# The `-p no:` flags are load-bearing, not tidiness.
#
# This project's venv inherits Anaconda's site-packages, where three packages
# register a `pytest11` entry point. One of them -- web3 6.11.3's
# `pytest_ethereum` -- crashes on import against eth-typing 5.2.1:
#     ImportError: cannot import name 'ContractName' from 'eth_typing'
# Plugin autoload is a sys.path scan, so a venv cannot escape it.
#
# Why HERE and not conftest.py: conftest is collected AFTER
# load_setuptools_entrypoints("pytest11"), so by then the process has already
# died. Why not PYTEST_DISABLE_PLUGIN_AUTOLOAD=1: it also disables pytest-cov,
# which the coverage gate needs. (It remains documented in docs/troubleshooting.md
# as a break-glass.)
#
# Mechanism: Config._preparse prepends addopts to argv and consumes `-p no:NAME`
# BEFORE autoload runs, and pluggy checks is_blocked(name) before ep.load() --
# so the broken module is never imported. Blocking an absent plugin is a no-op,
# which is why the same line is correct on Linux CI where web3 isn't installed.
#
# tests/unit/test_pytest_plugin_guard.py asserts this is still in effect.
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-p no:pytest_ethereum -p no:langsmith_plugin -ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:google.*",
]
markers = [
  "unit: fast, isolated, no I/O beyond tmp_path",
  "integration: full pipeline over the fixture corpus, offline",
  "regression: golden-file comparisons and frozen failure cases",
  "property: hypothesis-driven",
  "slow: takes more than 5 seconds",
  "needs_network: requires internet; skipped unless --run-network",
  "needs_api_key: requires a provider key; skipped unless --run-network",
  "needs_local_model: requires the HuggingFace MiniLM download; skipped unless --run-network",
]

# ---------------------------------------------------------------------------
# ruff -- single tool for both lint and format. black is deliberately not used;
# two formatters is a guaranteed CI lint-war.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "ARG", "TID"]
ignore = [
  "E501",    # line length is enforced by the formatter
  "RUF012",  # mutable class attrs without ClassVar -- noisy with pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]
"src/rag_eval/demo/**" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["rag_eval"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/rag_eval"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# Exploratory UI code must never gate the type check.
module = "rag_eval.demo.*"
disallow_untyped_defs = false
strict = false

[[tool.mypy.overrides]]
module = ["faiss.*", "transformers.*", "torch.*", "sklearn.*", "braintrust.*", "google.genai.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/rag_eval"]
omit = ["src/rag_eval/demo/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
